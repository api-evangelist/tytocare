aid: tytocare
name: TytoCare
description: >-
  TytoCare is an AI-powered remote physical examination and virtual care
  company. Its FDA-cleared handheld examination device and Home Smart Clinic /
  Pro Smart Clinic platforms let clinicians remotely examine heart, lungs,
  ears, throat, skin, and temperature, serving 240+ healthcare organizations
  and 1.6M+ patients. TytoCare publishes no public developer portal, API
  documentation, or client SDKs — EHR and telehealth integrations are
  delivered through private partner channels. An Insight Partners portfolio
  company in the API Evangelist network.
